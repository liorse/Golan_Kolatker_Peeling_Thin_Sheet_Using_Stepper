<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Peeling Log Analyser</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 1.5rem; }
    h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; }

    #toolbar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
    button {
      background: #2563eb; color: #fff; border: none; border-radius: 6px;
      padding: 0.45rem 1rem; font-size: 0.9rem; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #444; cursor: default; }

    #file-list {
      background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
      padding: 0.75rem 1rem; margin-bottom: 1rem; max-height: 240px; overflow-y: auto;
      display: none;
    }
    #file-list label {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.25rem 0; font-size: 0.85rem; cursor: pointer;
    }
    #file-list label:hover { color: #93c5fd; }
    #file-list input[type=checkbox] { accent-color: #2563eb; width: 15px; height: 15px; }

    #select-actions { display: none; gap: 0.5rem; margin-bottom: 0.75rem; }
    #select-actions button { background: #374151; font-size: 0.8rem; padding: 0.3rem 0.7rem; }
    #select-actions button:hover { background: #4b5563; }

    #chart-wrap {
      background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
      padding: 1rem; display: none;
    }
    #status { font-size: 0.82rem; color: #9ca3af; }
  </style>
</head>
<body>
  <h1>Peeling Log Analyser</h1>

  <div id="toolbar">
    <button id="btn-open">Open Folder</button>
    <button id="btn-plot" disabled>Plot selected</button>
    <span id="status">No folder selected.</span>
  </div>

  <div id="select-actions">
    <button id="btn-all">Select all</button>
    <button id="btn-none">Deselect all</button>
  </div>

  <div id="file-list" id="file-list"></div>

  <div id="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

  <script>
    const COLORS = [
      '#60a5fa','#34d399','#f87171','#fbbf24','#a78bfa',
      '#f472b6','#38bdf8','#4ade80','#fb923c','#e879f9'
    ];

    let dirHandle = null;
    let fileHandles = [];
    let chartInstance = null;

    const btnOpen   = document.getElementById('btn-open');
    const btnPlot   = document.getElementById('btn-plot');
    const btnAll    = document.getElementById('btn-all');
    const btnNone   = document.getElementById('btn-none');
    const fileList  = document.getElementById('file-list');
    const chartWrap = document.getElementById('chart-wrap');
    const status    = document.getElementById('status');
    const selActions = document.getElementById('select-actions');

    btnOpen.addEventListener('click', async () => {
      try {
        dirHandle = await window.showDirectoryPicker({ mode: 'read' });
      } catch {
        return;
      }

      fileHandles = [];
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'file' && name.endsWith('.csv')) {
          fileHandles.push({ name, handle });
        }
      }

      fileHandles.sort((a, b) => b.name.localeCompare(a.name));

      fileList.innerHTML = '';
      for (const { name } of fileHandles) {
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = name;
        cb.checked = true;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(name));
        fileList.appendChild(label);
      }

      const count = fileHandles.length;
      fileList.style.display = count ? 'block' : 'none';
      selActions.style.display = count ? 'flex' : 'none';
      btnPlot.disabled = count === 0;
      status.textContent = count
        ? `${count} CSV file${count > 1 ? 's' : ''} found — check the ones to plot.`
        : 'No CSV files found in this folder.';
    });

    btnAll.addEventListener('click',  () => setAll(true));
    btnNone.addEventListener('click', () => setAll(false));
    function setAll(checked) {
      fileList.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = checked);
    }

    btnPlot.addEventListener('click', async () => {
      const selected = [...fileList.querySelectorAll('input[type=checkbox]:checked')]
        .map(cb => cb.value);
      if (!selected.length) { status.textContent = 'No files selected.'; return; }

      status.textContent = 'Loading…';
      btnPlot.disabled = true;

      const datasets = [];
      for (let i = 0; i < selected.length; i++) {
        const name = selected[i];
        const fh   = fileHandles.find(f => f.name === name);
        if (!fh) continue;

        const file = await fh.handle.getFile();
        const text = await file.text();
        const { points, dutyLabel } = parseCSV(text);
        if (!points.length) continue;

        const label = legendLabel(name, dutyLabel);
        datasets.push({
          label,
          data: points,
          borderColor: COLORS[i % COLORS.length],
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0,
        });
      }

      if (!datasets.length) {
        status.textContent = 'No valid data found in selected files.';
        btnPlot.disabled = false;
        return;
      }

      renderChart(datasets);
      status.textContent = `Plotted ${datasets.length} run${datasets.length > 1 ? 's' : ''}.`;
      btnPlot.disabled = false;
    });

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length < 2) return { points: [], dutyLabel: null };

      const header = lines[0].split(',').map(h => h.trim());
      const tsIdx    = header.indexOf('timestamp');
      const tempIdx  = header.indexOf('temp_c');
      const dutyIdx  = header.indexOf('heater_duty');

      if (tsIdx === -1 || tempIdx === -1) return { points: [], dutyLabel: null };

      const points = [];
      let dutySum = 0, dutyCount = 0;

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',');
        if (cols.length <= Math.max(tsIdx, tempIdx)) continue;
        const ts   = new Date(cols[tsIdx].trim());
        const temp = parseFloat(cols[tempIdx].trim());
        if (isNaN(ts.getTime()) || isNaN(temp)) continue;
        points.push({ x: ts, y: temp });

        if (dutyIdx !== -1 && cols[dutyIdx] !== undefined) {
          const d = parseFloat(cols[dutyIdx].trim());
          if (!isNaN(d)) { dutySum += d; dutyCount++; }
        }
      }

      let dutyLabel = null;
      if (dutyCount > 0) {
        const avg = Math.round(dutySum / dutyCount);
        const pct = Math.round(avg / 255 * 100);
        dutyLabel = `duty ${pct}%`;
      }

      return { points, dutyLabel };
    }

    function legendLabel(filename, dutyLabel) {
      // Extract time portion from peel_YYYYMMDD_HHMMSS_...
      const m = filename.match(/peel_\d{8}_(\d{2})(\d{2})(\d{2})/);
      const time = m ? `${m[1]}:${m[2]}:${m[3]}` : filename.replace('.csv', '');
      return dutyLabel ? `${time} — ${dutyLabel}` : `${time} — duty n/a`;
    }

    function renderChart(datasets) {
      chartWrap.style.display = 'block';
      if (chartInstance) chartInstance.destroy();

      const allX = datasets.flatMap(ds => ds.data.map(p => p.x.getTime()));
      const xMin = Math.min(...allX);
      const xMax = Math.max(...allX);

      chartInstance = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: { datasets },
        options: {
          animation: false,
          parsing: false,
          scales: {
            x: {
              type: 'time',
              min: xMin,
              max: xMax,
              time: { tooltipFormat: 'HH:mm:ss', displayFormats: { second: 'HH:mm:ss', minute: 'HH:mm' } },
              ticks: { color: '#9ca3af', maxRotation: 30 },
              grid: { color: '#2a2a2a' },
              title: { display: true, text: 'Time', color: '#9ca3af' },
            },
            y: {
              ticks: { color: '#9ca3af' },
              grid: { color: '#2a2a2a' },
              title: { display: true, text: 'Temperature (°C)', color: '#9ca3af' },
            },
          },
          plugins: {
            legend: {
              labels: { color: '#eee', boxWidth: 14, padding: 16 },
            },
            tooltip: {
              mode: 'index',
              intersect: false,
              callbacks: {
                label: ctx => ` ${ctx.dataset.label.split(' —')[0]}: ${ctx.parsed.y.toFixed(1)} °C`,
              },
            },
          },
          interaction: { mode: 'index', intersect: false },
        },
      });
    }
  </script>
</body>
</html>
